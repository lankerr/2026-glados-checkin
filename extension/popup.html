<!DOCTYPE html>
<html lang="__MSG_htmlLang__">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 14px; background: #fafafa; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #333; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: #444; }
  .row b { color: #111; }
  .fire { color: #e377c2; font-weight: 700; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px;
           background: #e377c2; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #ccc; }
  .note { margin-top: 8px; font-size: 11px; color: #999; line-height: 1.5; }
</style>
</head>
<body>
<h1>__MSG_popupTitle__</h1>
<div class="row"><span>__MSG_labelStreak__</span><b class="fire" id="streak">-</b></div>
<div class="row"><span>__MSG_labelToday__</span><b id="today">-</b></div>
<div class="row"><span>__MSG_labelPoints__</span><b id="points">-</b></div>
<div class="row"><span>__MSG_labelSlots__</span><b>__MSG_slotsValue__</b></div>
<button id="run">__MSG_btnCheckin__</button>
<div class="note">__MSG_popupNote__</div>
<script src="popup.js"></script>
</body>
</html>
