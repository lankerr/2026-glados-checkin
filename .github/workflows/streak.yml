name: Daily Streak Report

on:
  schedule:
    # 北京时间 10:05（在 09:30 本地签到与 09:31 云端只读核对之后）
    - cron: '5 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Summarize visible check-in history
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
        run: python update_streak.py
