<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 14px; background: #fafafa; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #333; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: #444; }
  .row b { color: #111; }
  .fire { color: #e377c2; font-weight: 700; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px;
           background: #e377c2; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #ccc; }
  button.secondary { margin-top: 8px; background: #fff; color: #e377c2; border: 1px solid #e377c2; }
  .note { margin-top: 8px; font-size: 11px; color: #999; line-height: 1.5; }
  .hint { margin-top: 10px; padding: 8px 10px; background: #fff; border: 1px solid #f0d0e6; border-radius: 8px; }
  .hint p { margin: 0; font-size: 11px; color: #666; line-height: 1.55; }
  .hint code { font-size: 10px; color: #a14a86; word-break: break-all; }
</style>
</head>
<body>
<h1 data-i18n="popupTitle">GLaDOS Check-in</h1>

<div class="row"><span data-i18n="labelAccount"></span><b id="account">—</b></div>
<div class="row"><span data-i18n="labelAutomation"></span><b id="automation">—</b></div>
<div class="row"><span data-i18n="labelTask"></span><b id="task">—</b></div>
<div class="row"><span data-i18n="labelLedger"></span><b id="points">—</b></div>
<div class="row"><span data-i18n="labelSlots"></span><b data-i18n="slotsValue"></b></div>
<button id="connect" data-i18n="connect"></button>
<button id="enable" data-i18n="enable"></button>
<button id="run" data-i18n="btnCheckin"></button>
<button id="pause" class="secondary" data-i18n="pause"></button>
<button id="openSite" class="secondary" data-i18n="openSite"></button>
<button id="reviewTask" class="secondary" data-i18n="reviewTask"></button>
<button id="forget" class="secondary" data-i18n="forget"></button>
<p id="error" role="status"></p>
<div class="note" data-i18n="popupNote"></div>
<div class="note" data-i18n="ledgerNote"></div>
<div class="hint">
  <p id="bgHint"></p>
  <button type="button" id="copySettings" class="secondary">复制设置地址</button>
</div>
<script src="popup.js"></script>
</body>
</html>
